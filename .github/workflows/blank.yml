name: Download YouTube as MP3 and Create Release

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://www.youtube.com/watch?v=jgFYSWSF84M'
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install yt-dlp and ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install yt-dlp
    
    - name: Download as MP3
      run: |
        yt-dlp \
          --cookies cookies.txt \
          --extract-audio \
          --audio-format mp3 \
          --audio-quality 320K \
          --output "audio_%(title)s.%(ext)s" \
          --no-playlist \
          --add-metadata \
          --embed-thumbnail \
          "${{ github.event.inputs.video_url }}"
    
    - name: Get video title
      id: video_info
      run: |
        VIDEO_TITLE=$(yt-dlp --cookies cookies.txt --get-title "${{ github.event.inputs.video_url }}")
        SAFE_TITLE=$(echo "$VIDEO_TITLE" | sed 's/[\/:*?"<>|]/_/g')
        echo "title=$SAFE_TITLE" >> $GITHUB_OUTPUT
        echo "Downloaded: $VIDEO_TITLE"
    
    - name: Find MP3 file
      id: find_mp3
      run: |
        MP3_FILE=$(ls *.mp3 2>/dev/null | head -n 1)
        if [ -z "$MP3_FILE" ]; then
          echo "No MP3 file found!"
          exit 1
        fi
        echo "mp3_file=$MP3_FILE" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "mp3-${{ github.run_number }}"
        name: "🎵 ${{ steps.video_info.outputs.title }}"
        body: |
          **Video URL:** ${{ github.event.inputs.video_url }}
          **Quality:** 320 Kbps MP3
          **Downloaded:** $(date +'%Y-%m-%d %H:%M:%S')
        files: ${{ steps.find_mp3.outputs.mp3_file }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
