name: Download YouTube as MP3 and Create Release

on:
  workflow_dispatch:  # اجرای دستی
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://www.youtube.com/watch?v=jgFYSWSF84M'
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # اجازه آپلود در Releases
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install yt-dlp and ffmpeg
      run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp
    
    - name: Create cookies file
      run: |
          cat > cookies.txt << 'EOF'
