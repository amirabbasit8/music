name: FINAL YouTube Playlist Downloader (Guaranteed to work)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Playlist URL'
        required: true
        default: 'https://www.youtube.com/playlist?list=PLZs1E3Ytd4XjRhu7xxG1AsxJ0FoZFFeqh'
        type: string

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # نصب Deno (بهترین runtime برای این کار)
      - name: Install Deno JavaScript Runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # دانلود باینری رسمی yt-dlp (نه نسخه pip)
      - name: Download official yt-dlp binary
        run: |
          wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O yt-dlp
          chmod +x yt-dlp

      - name: Download entire playlist as 720p MP4
        run: |
          mkdir -p videos
          # استفاده از Deno به عنوان runtime و فعال کردن EJS از npm
          ./yt-dlp \
            --cookies cookies.txt \
            --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best" \
            --merge-output-format mp4 \
            --output "videos/%(playlist_index)02d - %(title)s.%(ext)s" \
            --ignore-errors \
            --continue \
            --no-overwrites \
            --remote-components "ejs:npm" \
            --compat-options manifest-filesize-approx \
            "${{ github.event.inputs.playlist_url }}"

      - name: Compress videos
        run: zip -r -9 full-playlist.zip videos/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "final-playlist-${{ github.run_number }}"
          name: "✅ نهایی - کل پلی‌لیست دوره زبان"
          body: |
            🎬 **دانلود کامل پلی‌لیست آموزش زبان انگلیسی**
            
            - **کیفیت:** 720p MP4
            - **تعداد:** تمام ویدیوهای موجود
            - **لینک:** ${{ github.event.inputs.playlist_url }}
            
            ## 🔧 نحوه رفع خطای n challenge
            این دانلود با استفاده از **Deno runtime** و **EJS scripts از npm** انجام شده است.
            
            فایل ZIP را دانلود و Extract کنید.
          files: full-playlist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
