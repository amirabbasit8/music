name: Download Full YouTube Playlist (720p)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Playlist URL'
        required: true
        default: 'https://www.youtube.com/playlist?list=PLZs1E3Ytd4XjRhu7xxG1AsxJ0FoZFFeqh'
        type: string

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # نصب رانتایم جاوااسکریپت برای حل چالش یوتیوب
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Download entire playlist
        run: |
          mkdir -p videos
          yt-dlp \
            --cookies cookies.txt \
            --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]" \
            --merge-output-format mp4 \
            --output "videos/%(playlist_index)02d - %(title)s.%(ext)s" \
            --ignore-errors \
            --continue \
            --no-overwrites \
            "${{ github.event.inputs.playlist_url }}"

      - name: Compress videos into ZIP
        run: |
          zip -r -9 full-playlist.zip videos/

      - name: Split ZIP into 2GB chunks
        run: |
          mkdir -p chunks
          split -b 1900M -d --verbose full-playlist.zip chunks/playlist-part- --additional-suffix=.zip

      - name: Create Release and upload chunks
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "playlist-full-v1.0.${{ github.run_number }}"
          name: "✅ کامل - کل پلی‌لیست (تقسیم شده)"
          body: |
            🎬 **پلی‌لیست دوره زبان انگلیسی**

            📥 **تعداد ویدیوها:** تمام ویدیوهای موجود در پلی‌لیست
            📁 **کیفیت:** 720p MP4
            🔗 **لینک پلی‌لیست:** ${{ github.event.inputs.playlist_url }}
            📅 **تاریخ دانلود:** $(date +'%Y-%m-%d %H:%M:%S')

            ## ⚠️ نحوه دانلود و ترکیب فایل‌ها
            به دلیل محدودیت حجم فایل در گیت‌هاب، فایل ZIP اصلی به چند بخش ۲ گیگابایتی تقسیم شده است.

            **مراحل ترکیب فایل‌ها پس از دانلود:**
            1. تمام فایل‌های `playlist-part-*.zip` را در یک پوشه خالی دانلود کنید.
            2. در ویندوز (CMD یا PowerShell):
               ```cmd
               copy /b playlist-part-00.zip + playlist-part-01.zip + playlist-part-02.zip full-playlist.zip
