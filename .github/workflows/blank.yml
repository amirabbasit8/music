.youtube.com	TRUE	/	TRUE	0	__Secure-3PSIDTS	sidts-CjUBWhotCRSfeugLrlaauR2NC7geHSSZCRzKFQfVHJuGSfboI6qPKHn6txRc00IItuIUFBkQ_hAA
.youtube.com	TRUE	/	TRUE	0	SIDCC	AKEyXzWVhtQftw8CaVQ1FBSvCMbL3XcZDZBoTRLmrxLHXiJp7Jcah4KOjx1UG6f8b6QxHjLG8g
.youtube.com	TRUE	/	TRUE	0	__Secure-1PSIDCC	AKEyXzVLWm8SZrBDhCw1SxYRX52UD4QCKDk9h1yc5_jTj0VbmxRt8dAusfAzkmU3mnr9AdBLp-o
.youtube.com	TRUE	/	TRUE	0	__Secure-3PSIDCC	AKEyXzWWnI2F-JYQzWiU4zjXmWPyR2Cjwv99be2u65rUDWa5ZMM2aI6khs5vPFFA620xuhNWxwI
.youtube.com	TRUE	/	TRUE	0	VISITOR_INFO1_LIVE	N-KO3gPZJV8
.youtube.com	TRUE	/	TRUE	0	VISITOR_PRIVACY_METADATA	CgJERRIEEgAgFQ%3D%3D
EOF
      shell: bash
    
    - name: Get video info
      id: video_info
      run: |
          VIDEO_TITLE=$(yt-dlp --cookies cookies.txt --get-title "${{ github.event.inputs.video_url }}")
          # پاک کردن کاراکترهای غیرمجاز برای نام فایل
          SAFE_TITLE=$(echo "$VIDEO_TITLE" | sed 's/[\/:*?"<>|]/_/g')
          echo "title=$SAFE_TITLE" >> $GITHUB_OUTPUT
          echo "Downloading: $VIDEO_TITLE"
    
    - name: Download as MP3
      run: |
          yt-dlp \
            --cookies cookies.txt \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 320K \
            --output "audio_%(title)s.%(ext)s" \
            --no-playlist \
            --add-metadata \
            --metadata-from-title "%(title)s" \
            --embed-thumbnail \
            "${{ github.event.inputs.video_url }}"
    
    - name: Find MP3 file
      id: find_mp3
      run: |
          MP3_FILE=$(ls *.mp3 2>/dev/null | head -n 1)
          if [ -z "$MP3_FILE" ]; then
            echo "No MP3 file found!"
            exit 1
          fi
          echo "mp3_file=$MP3_FILE" >> $GITHUB_OUTPUT
          echo "Found: $MP3_FILE"
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "MP3 - ${{ steps.video_info.outputs.title }}"
        body: |
          ## 🎵 MP3 دانلود شده از YouTube
          
          - **عنوان:** ${{ steps.video_info.outputs.title }}
          - **لینک:** ${{ github.event.inputs.video_url }}
          - **کیفیت:** 320 Kbps MP3
          - **تاریخ:** $(date +'%Y-%m-%d %H:%M:%S')
          - **شماره بیلد:** #${{ github.run_number }}
          
          ### نحوه دانلود:
          فایل MP3 در بخش Assets پایین صفحه قابل دانلود است.
        files: |
          ${{ steps.find_mp3.outputs.mp3_file }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
