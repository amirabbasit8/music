name: FINAL YouTube Playlist Downloader (Guaranteed to work)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Playlist URL'
        required: true
        default: 'https://www.youtube.com/playlist?list=PLZs1E3Ytd4XjRhu7xxG1AsxJ0FoZFFeqh'
        type: string

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno JavaScript Runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Download official yt-dlp binary
        run: |
          wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O yt-dlp
          chmod +x yt-dlp

      - name: Create or load download archive
        run: |
          if [ ! -f downloaded.txt ]; then
            touch downloaded.txt
          fi

      - name: Download and upload videos one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ایجاد پوشه موقت
          mkdir -p temp_videos
          
          # دریافت لیست ویدیوها با ایندکس و آی‌دی
          ./yt-dlp \
            --cookies cookies.txt \
            --flat-playlist \
            --print "%(playlist_index)02d - %(title)s" \
            --print "%(id)s" \
            "${{ github.event.inputs.playlist_url }}" | paste -d '|' - - > playlist_items.txt
          
          # ایجاد Release
          TAG_NAME="playlist-v1.0.${{ github.run_number }}"
          if ! gh release view "$TAG_NAME" --repo "${{ github.repository }}" &>/dev/null; then
            gh release create "$TAG_NAME" \
              --title "🎬 دوره کامل زبان انگلیسی - ویدیوهای تکی" \
              --notes "ویدیوها با شماره‌گذاری از 01 تا 128" \
              --repo "${{ github.repository }}"
          fi
          
          # دانلود و آپلود هر ویدیو
          while IFS='|' read -r video_title video_id; do
            # چک کردن آرشیو
            if grep -Fxq "$video_id" downloaded.txt; then
              echo "⏭️ رد شدن: $video_title"
              continue
            fi
            
            echo "📥 دانلود: $video_title ($video_id)"
            
            # پاک کردن پوشه موقت قبل از هر دانلود
            rm -rf temp_videos/*
            
            # دانلود ویدیو با فرمت دلخواه
            ./yt-dlp \
              --cookies cookies.txt \
              --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best" \
              --merge-output-format mp4 \
              --output "temp_videos/%(title)s.%(ext)s" \
              --no-playlist \
              --remote-components "ejs:npm" \
              "https://www.youtube.com/watch?v=$video_id"
            
            # پیدا کردن فایل دانلود شده
            VIDEO_FILE=$(ls temp_videos/*.mp4 2>/dev/null | head -n 1)
            
            if [ -f "$VIDEO_FILE" ]; then
              # ساخت اسم جدید: 01 - عنوان.mp4 (پاک کردن کاراکترهای غیرمجاز)
              SAFE_TITLE=$(echo "$video_title" | sed 's/[\/:*?"<>|]/_/g' | sed 's/|/_/g')
              NEW_NAME="${SAFE_TITLE}.mp4"
              
              # تغییر نام فایل
              mv "$VIDEO_FILE" "temp_videos/$NEW_NAME"
              
              # آپلود به Release
              echo "📤 آپلود: $NEW_NAME"
              gh release upload "$TAG_NAME" "temp_videos/$NEW_NAME" \
                --repo "${{ github.repository }}" \
                --clobber
              
              # ثبت در آرشیو
              echo "$video_id" >> downloaded.txt
              echo "✅ آپلود شد: $NEW_NAME"
            else
              echo "❌ خطا در دانلود: $video_id"
            fi
            
            echo "-----------------------------------"
          done < playlist_items.txt
          
          rm -rf temp_videos
          echo "🎉 همه ویدیوها دانلود و آپلود شدن!"

      - name: Commit download archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded.txt
          git commit -m "Update download archive" || echo "No changes to commit"
          git push
