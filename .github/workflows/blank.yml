name: FINAL YouTube Playlist Downloader (Guaranteed to work)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Playlist URL'
        required: true
        default: 'https://www.youtube.com/playlist?list=PLZs1E3Ytd4XjRhu7xxG1AsxJ0FoZFFeqh'
        type: string

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Deno JavaScript Runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Download official yt-dlp binary
        run: |
          wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O yt-dlp
          chmod +x yt-dlp

      - name: Create or load download archive
        run: |
          if [ ! -f downloaded.txt ]; then
            touch downloaded.txt
          fi

      - name: Download and upload videos one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_videos
          
          # دریافت لیست ویدیوها از 125 به بعد
          ./yt-dlp \
            --cookies cookies.txt \
            --flat-playlist \
            --print "%(playlist_index)02d %(id)s" \
            --playlist-start 125 \
            "${{ github.event.inputs.playlist_url }}" > video_list.txt
          
          echo "🎯 دانلود از ویدیو شماره 125 شروع میشه. تعداد: $(wc -l < video_list.txt) ویدیو"
          cat video_list.txt
          
          # ایجاد Release
          TAG_NAME="playlist-v1.0.${{ github.run_number }}"
          if ! gh release view "$TAG_NAME" --repo "${{ github.repository }}" &>/dev/null; then
            gh release create "$TAG_NAME" \
              --title "🎬 دوره کامل زبان انگلیسی - ادامه از ویدیو 125" \
              --notes "دانلود از ویدیو 125 تا آخر" \
              --repo "${{ github.repository }}"
          fi
          
          # دانلود و آپلود هر ویدیو
          while read -r idx video_id; do
            # چک کردن آرشیو
            if grep -Fxq "$video_id" downloaded.txt 2>/dev/null; then
              echo "⏭️ رد شدن ویدیو شماره $idx: $video_id (قبلاً دانلود شده)"
              continue
            fi
            
            echo "📥 دانلود ویدیو شماره $idx: $video_id"
            
            rm -rf temp_videos/*
            
            # دریافت عنوان ویدیو
            VIDEO_TITLE=$(./yt-dlp --cookies cookies.txt --get-title "https://www.youtube.com/watch?v=$video_id" 2>/dev/null | head -n1)
            SAFE_TITLE=$(echo "$VIDEO_TITLE" | sed 's/[\/:*?"<>|]/_/g' | cut -c1-100)
            
            # دانلود ویدیو با تنظیمات ضد محدودیت یوتیوب
            ./yt-dlp \
              --cookies cookies.txt \
              --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best" \
              --merge-output-format mp4 \
              --output "temp_videos/%(title)s.%(ext)s" \
              --no-playlist \
              --remote-components "ejs:npm" \
              --retries 30 \
              --fragment-retries 30 \
              --retry-sleep "exp=2:60:2" \
              --sleep-interval 20 \
              --max-sleep-interval 35 \
              --sleep-interval-requests 3 \
              --limit-rate 1.5M \
              --socket-timeout 90 \
              --no-check-certificates \
              --extractor-args "youtube:player_client=android,web" \
              "https://www.youtube.com/watch?v=$video_id"
            
            VIDEO_FILE=$(ls temp_videos/*.mp4 2>/dev/null | head -n 1)
            
            if [ -f "$VIDEO_FILE" ]; then
              NEW_NAME="${idx} - ${SAFE_TITLE}.mp4"
              rm -f "temp_videos/$NEW_NAME"
              mv "$VIDEO_FILE" "temp_videos/$NEW_NAME"
              
              echo "📤 آپلود: $NEW_NAME"
              gh release upload "$TAG_NAME" "temp_videos/$NEW_NAME" \
                --repo "${{ github.repository }}" \
                --clobber
              
              echo "$video_id" >> downloaded.txt
              echo "✅ آپلود شد: $NEW_NAME"
              
              # تاخیر اضافی بین آپلود و دانلود بعدی
              echo "⏳ استراحت 30 ثانیه قبل از ویدیو بعدی..."
              sleep 30
            else
              echo "❌ خطا در دانلود ویدیو: $video_id"
              echo "$video_id" >> failed.txt
            fi
            
            echo "-----------------------------------"
          done < video_list.txt
          
          rm -rf temp_videos
          echo "🎉 دانلود و آپلود ویدیوهای 125 تا پایان کامل شد!"
          
          if [ -f failed.txt ]; then
            echo "⚠️ ویدیوهای ناموفق:"
            cat failed.txt
          fi

      - name: Commit download archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded.txt failed.txt 2>/dev/null || true
          git commit -m "Update download archive" || echo "No changes to commit"
          git push
