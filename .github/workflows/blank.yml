name: FINAL YouTube Playlist Downloader (Guaranteed to work)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Playlist URL'
        required: true
        default: 'https://www.youtube.com/playlist?list=PLZs1E3Ytd4XjRhu7xxG1AsxJ0FoZFFeqh'
        type: string

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # ✅ این خط برای آپلود در Release ضروری است
      id-token: write          # برای احراز هویت

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno JavaScript Runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Download official yt-dlp binary
        run: |
          wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O yt-dlp
          chmod +x yt-dlp

      - name: Create or load download archive
        run: |
          if [ ! -f downloaded.txt ]; then
            touch downloaded.txt
          fi

      - name: Download and upload videos one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_videos
          
          # دریافت لیست ویدیوها با شماره و آیدی
          ./yt-dlp \
            --cookies cookies.txt \
            --flat-playlist \
            --print "%(playlist_index)02d %(id)s" \
            "${{ github.event.inputs.playlist_url }}" > video_list.txt
          
          TAG_NAME="playlist-v1.0.${{ github.run_number }}"
          
          while read -r number video_id; do
            if grep -Fxq "$video_id" downloaded.txt; then
              echo "⏭️ رد شدن: $number"
              continue
            fi
            
            echo "📥 در حال دانلود شماره $number"
            
            # دانلود با اسم شماره‌دار
            ./yt-dlp \
              --cookies cookies.txt \
              --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best" \
              --merge-output-format mp4 \
              --output "temp_videos/${number}.mp4" \
              --no-playlist \
              --remote-components "ejs:npm" \
              "https://www.youtube.com/watch?v=$video_id"
            
            if [ -f "temp_videos/${number}.mp4" ]; then
              gh release upload "$TAG_NAME" "temp_videos/${number}.mp4" --repo "${{ github.repository }}" --clobber
              echo "$video_id" >> downloaded.txt
              rm -f "temp_videos/${number}.mp4"
              echo "✅ آپلود شد: $number.mp4"
            fi
          done < video_list.txt
          
          rm -rf temp_videos

      - name: Update Release body with completion info
        run: |
          TOTAL=$(wc -l < video_ids.txt)
          DOWNLOADED=$(wc -l < downloaded.txt)
          gh release edit "playlist-v1.0.${{ github.run_number }}" \
            --notes "## ✅ تکمیل شد!
            
            **تعداد کل ویدیوها:** $TOTAL
            **تعداد دانلود شده:** $DOWNLOADED
            **کیفیت:** 720p MP4
            **لینک پلی‌لیست:** ${{ github.event.inputs.playlist_url }}
            
            ---
            
            ### 📌 نحوه دانلود
            هر ویدیو به صورت جداگانه در بخش Assets قابل دانلود است.
            
            ### 🔄 ادامه دانلود
            اگر دفعه بعد دوباره این اکشن رو اجرا کنید، فقط ویدیوهای جدید دانلود می‌شن." \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit download archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded.txt
          git commit -m "Update download archive" || echo "No changes to commit"
          git push
