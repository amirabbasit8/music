name: FINAL YouTube Playlist Downloader (Guaranteed to work)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Playlist URL'
        required: true
        default: 'https://www.youtube.com/playlist?list=PLZs1E3Ytd4XjRhu7xxG1AsxJ0FoZFFeqh'
        type: string

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # ✅ این خط برای آپلود در Release ضروری است
      id-token: write          # برای احراز هویت

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno JavaScript Runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Download official yt-dlp binary
        run: |
          wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O yt-dlp
          chmod +x yt-dlp

      - name: Create or load download archive
        run: |
          if [ ! -f downloaded.txt ]; then
            touch downloaded.txt
          fi

      - name: Download and upload videos one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # ✅ توکن رو به محیط اضافه کنید
        run: |
          # ایجاد پوشه موقت برای ویدیوها
          mkdir -p temp_videos
          
          # دریافت لیست ویدیوهای پلی‌لیست
          ./yt-dlp \
            --cookies cookies.txt \
            --flat-playlist \
            --print "%(id)s" \
            "${{ github.event.inputs.playlist_url }}" > video_ids.txt
          
          # ایجاد یا استفاده از Release موجود
          TAG_NAME="playlist-v1.0.${{ github.run_number }}"
          RELEASE_NAME="🎬 دوره کامل زبان انگلیسی - دانلود تکی"
          
          # چک کن Release وجود داره یا نه
          if ! gh release view "$TAG_NAME" --repo "${{ github.repository }}" &>/dev/null; then
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes "## 📚 دانلود پلی‌لیست آموزش زبان انگلیسی - ویدیوهای تکی\n\n**کیفیت:** 720p MP4\n**لینک:** ${{ github.event.inputs.playlist_url }}\n\nویدیوها به صورت تکی آپلود می‌شن." \
              --repo "${{ github.repository }}"
          fi
          
          # دانلود و آپلود هر ویدیو
          while IFS= read -r video_id; do
            # چک کن آیا قبلاً دانلود شده
            if grep -Fxq "$video_id" downloaded.txt; then
              echo "⏭️ رد شدن از ویدیو قبلاً دانلود شده: $video_id"
              continue
            fi
            
            echo "📥 در حال دانلود ویدیو: $video_id"
            
            # دانلود ویدیو
            ./yt-dlp \
              --cookies cookies.txt \
              --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best" \
              --merge-output-format mp4 \
              --output "temp_videos/%(title)s.%(ext)s" \
              --no-playlist \
              --remote-components "ejs:npm" \
              --compat-options manifest-filesize-approx \
              "https://www.youtube.com/watch?v=$video_id" \
              --download-archive downloaded.txt
            
            # پیدا کردن فایل دانلود شده
            VIDEO_FILE=$(ls temp_videos/*.mp4 2>/dev/null | head -n 1)
            
            if [ -f "$VIDEO_FILE" ]; then
              # گرفتن عنوان ویدیو برای اسم فایل
              VIDEO_TITLE=$(basename "$VIDEO_FILE" .mp4)
              SAFE_TITLE=$(echo "$VIDEO_TITLE" | sed 's/[\/:*?"<>|]/_/g')
              
              # تغییر نام فایل به فرمت مناسب
              mv "$VIDEO_FILE" "temp_videos/${SAFE_TITLE}.mp4"
              FINAL_FILE="temp_videos/${SAFE_TITLE}.mp4"
              
              # آپلود فایل به Release
              echo "📤 آپلود ویدیو: $SAFE_TITLE"
              gh release upload "$TAG_NAME" "$FINAL_FILE" \
                --repo "${{ github.repository }}" \
                --clobber
              
              # حذف فایل موقت
              rm -f "$FINAL_FILE"
              echo "✅ ویدیو با موفقیت آپلود شد: $SAFE_TITLE"
            else
              echo "❌ خطا در دانلود ویدیو: $video_id"
            fi
            
            echo "-----------------------------------"
          done < video_ids.txt
          
          # پاک کردن پوشه موقت
          rm -rf temp_videos
          
          echo "🎉 همه ویدیوها پردازش شدن!"

      - name: Update Release body with completion info
        run: |
          TOTAL=$(wc -l < video_ids.txt)
          DOWNLOADED=$(wc -l < downloaded.txt)
          gh release edit "playlist-v1.0.${{ github.run_number }}" \
            --notes "## ✅ تکمیل شد!
            
            **تعداد کل ویدیوها:** $TOTAL
            **تعداد دانلود شده:** $DOWNLOADED
            **کیفیت:** 720p MP4
            **لینک پلی‌لیست:** ${{ github.event.inputs.playlist_url }}
            
            ---
            
            ### 📌 نحوه دانلود
            هر ویدیو به صورت جداگانه در بخش Assets قابل دانلود است.
            
            ### 🔄 ادامه دانلود
            اگر دفعه بعد دوباره این اکشن رو اجرا کنید، فقط ویدیوهای جدید دانلود می‌شن." \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit download archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded.txt
          git commit -m "Update download archive" || echo "No changes to commit"
          git push
