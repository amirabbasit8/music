name: FINAL YouTube Playlist Downloader (No Archive)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Playlist URL'
        required: true
        default: 'https://www.youtube.com/playlist?list=PLZs1E3Ytd4XjRhu7xxG1AsxJ0FoZFFeqh'
        type: string

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno JavaScript Runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Download official yt-dlp binary
        run: |
          wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O yt-dlp
          chmod +x yt-dlp

      - name: Download and upload videos one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ایجاد پوشه موقت
          mkdir -p temp_videos
          
          # دریافت لیست ویدیوهای پلی‌لیست با شماره و آیدی
          ./yt-dlp \
            --cookies cookies.txt \
            --flat-playlist \
            --print "%(playlist_index)02d %(id)s" \
            "${{ github.event.inputs.playlist_url }}" > video_list.txt
          
          # ایجاد Release جدید
          TAG_NAME="playlist-v1.0.${{ github.run_number }}"
          RELEASE_NAME="🎬 دوره کامل زبان انگلیسی - 720p MP4"
          
          gh release create "$TAG_NAME" \
            --title "$RELEASE_NAME" \
            --notes "## 📚 دانلود پلی‌لیست آموزش زبان انگلیسی
          
**کیفیت:** 720p MP4
**تعداد ویدیوها:** $(wc -l < video_list.txt)
**لینک:** ${{ github.event.inputs.playlist_url }}

---
### 📌 نحوه دانلود
فایل‌ها با نام **1.mp4**، **2.mp4**، ... تا آخر شماره‌گذاری شده‌اند." \
            --repo "${{ github.repository }}"
          
          # دانلود و آپلود هر ویدیو
          while IFS=' ' read -r number video_id; do
            echo "========================================"
            echo "📥 در حال دانلود ویدیو شماره: $number"
            echo "🆔 آیدی: $video_id"
            
            # دانلود ویدیو با نام شماره‌دار
            ./yt-dlp \
              --cookies cookies.txt \
              --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best" \
              --merge-output-format mp4 \
              --output "temp_videos/${number}.mp4" \
              --no-playlist \
              --remote-components "ejs:npm" \
              --compat-options manifest-filesize-approx \
              "https://www.youtube.com/watch?v=$video_id"
            
            # چک کردن فایل دانلود شده
            if [ -f "temp_videos/${number}.mp4" ]; then
              # آپلود فایل
              echo "📤 آپلود ویدیو شماره $number"
              gh release upload "$TAG_NAME" "temp_videos/${number}.mp4" \
                --repo "${{ github.repository }}" \
                --clobber
              
              # حذف فایل موقت
              rm -f "temp_videos/${number}.mp4"
              echo "✅ ویدیو شماره $number با موفقیت آپلود شد"
            else
              echo "❌ خطا در دانلود ویدیو شماره $number"
            fi
            
          done < video_list.txt
          
          # پاک کردن پوشه موقت
          rm -rf temp_videos
          rm -f video_list.txt
          
          echo "========================================"
          echo "🎉 همه ویدیوها با موفقیت آپلود شدن!"

      - name: Update Release with completion info
        run: |
          TOTAL=$(gh release view "playlist-v1.0.${{ github.run_number }}" --repo "${{ github.repository }}" --json assets -q '.assets | length')
          gh release edit "playlist-v1.0.${{ github.run_number }}" \
            --notes "## ✅ تکمیل شد!
            
**تعداد کل ویدیوها:** $TOTAL
**کیفیت:** 720p MP4
**فرمت نامگذاری:** 1.mp4, 2.mp4, ...
**لینک پلی‌لیست:** ${{ github.event.inputs.playlist_url }}

---
### 📥 نحوه دانلود
همه ویدیوها در بخش Assets قابل دانلود هستند. اسم فایل‌ها به صورت **شماره.mp4** است.

### 💡 نکته
برای دانلود همه ویدیوها می‌توانید از ابزارهای دانلود منیجر استفاده کنید." \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
