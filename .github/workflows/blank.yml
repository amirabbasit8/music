name: Download YouTube MP3

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
        default: 'https://www.youtube.com/watch?v=jgFYSWSF84M'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install FFmpeg and yt-dlp
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install --upgrade yt-dlp
        pip install yt-dlp-ejs
    
    - name: Download as MP3
      run: |
        yt-dlp \
          --cookies cookies.txt \
          --extract-audio \
          --audio-format mp3 \
          --audio-quality 320K \
          --output "audio_%(title)s.%(ext)s" \
          --no-playlist \
          --add-metadata \
          --embed-thumbnail \
          "${{ github.event.inputs.video_url }}"
    
    - name: Upload MP3
      uses: actions/upload-artifact@v4
      with:
        name: mp3-file
        path: "*.mp3"
