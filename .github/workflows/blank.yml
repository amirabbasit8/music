name: FINAL YouTube Playlist Downloader

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Playlist URL'
        required: true
        default: 'https://www.youtube.com/playlist?list=PLZs1E3Ytd4XjRhu7xxG1AsxJ0FoZFFeqh'
        type: string

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache
          df -h /

      - name: Install Deno JavaScript Runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Download official yt-dlp binary
        run: |
          wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O yt-dlp
          chmod +x yt-dlp

      - name: Get playlist video IDs with indexes
        run: |
          # دریافت لیست ویدیوها با شماره و آیدی
          ./yt-dlp \
            --cookies cookies.txt \
            --flat-playlist \
            --print "%(playlist_index)s %(id)s" \
            "${{ github.event.inputs.playlist_url }}" > playlist.txt
          
          TOTAL_VIDEOS=$(wc -l < playlist.txt)
          echo "TOTAL_VIDEOS=$TOTAL_VIDEOS" >> $GITHUB_ENV
          echo "📊 تعداد کل ویدیوها: $TOTAL_VIDEOS"

      - name: Create Release
        run: |
          TAG_NAME="playlist-v1.0.${{ github.run_number }}"
          RELEASE_NAME="🎬 دوره کامل زبان انگلیسی - ویدیوهای شماره‌دار"
          
          gh release create "$TAG_NAME" \
            --title "$RELEASE_NAME" \
            --notes "## 📚 دانلود پلی‌لیست آموزش زبان انگلیسی
          
**کیفیت:** 720p MP4  
**تعداد ویدیوها:** ${{ env.TOTAL_VIDEOS }}  
**لینک پلی‌لیست:** ${{ github.event.inputs.playlist_url }}

---
### 📌 نام فایل‌ها
فایل‌ها به صورت زیر نام‌گذاری شده‌اند:
- \`1.mp4\`, \`2.mp4\`, \`3.mp4\`, ...

برای دانلود، روی هر فایل کلیک کنید." \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and upload videos one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="playlist-v1.0.${{ github.run_number }}"
          
          while read -r number video_id; do
            echo "========================================="
            echo "📥 در حال دانلود ویدیو شماره: $number"
            echo "🆔 آیدی: $video_id"
            
            rm -f temp_video.mp4
            
            ./yt-dlp \
              --cookies cookies.txt \
              --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best" \
              --merge-output-format mp4 \
              --output "temp_video.mp4" \
              --no-playlist \
              --remote-components "ejs:npm" \
              --compat-options manifest-filesize-approx \
              "https://www.youtube.com/watch?v=$video_id"
            
            if [ -f "temp_video.mp4" ] && [ -s "temp_video.mp4" ]; then
              FINAL_NAME="${number}.mp4"
              mv temp_video.mp4 "$FINAL_NAME"
              
              echo "📤 آپلود ویدیو شماره: $number"
              gh release upload "$TAG_NAME" "$FINAL_NAME" \
                --repo "${{ github.repository }}" \
                --clobber
              
              rm -f "$FINAL_NAME"
              echo "✅ ویدیو شماره $number با موفقیت آپلود شد"
            else
              echo "❌ خطا در دانلود ویدیو شماره $number"
            fi
            
          done < playlist.txt
          
          rm -f temp_video.mp4
          echo "========================================="
          echo "🎉 همه ویدیوها با موفقیت پردازش شدند!"

      - name: Update Release with completion info
        run: |
          TAG_NAME="playlist-v1.0.${{ github.run_number }}"
          TOTAL=$(wc -l < playlist.txt)
          
          gh release edit "$TAG_NAME" \
            --notes "## ✅ دانلود کامل شد!
            
**تعداد کل ویدیوها:** $TOTAL
**کیفیت:** 720p MP4
**لینک پلی‌لیست:** ${{ github.event.inputs.playlist_url }}

---
### 📁 فایل‌های قابل دانلود

فایل‌ها با نام‌های \`1.mp4\` تا \`$TOTAL.mp4\` در بخش Assets زیر قابل مشاهده هستند.

---
🔧 **تولید شده با:** yt-dlp + Deno runtime" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
